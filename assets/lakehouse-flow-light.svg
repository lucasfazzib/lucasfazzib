<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">From source systems to AI-ready data products</title>
<desc id="desc">Sources such as Salesforce CDC, Postgres, APIs and documents flow through ingestion (Pub/Sub, Kafka, Debezium, Auto Loader, dlt, ADF) into a Delta Lake medallion lakehouse (bronze, silver, gold) governed by Unity Catalog, which serves analytics, semantic layers, RAG pipelines and AI agents.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .h1 { fill: #1f2328; font-size: 26px; font-weight: 600; letter-spacing: -0.4px; }
  .sub { fill: #59636e; font-size: 15px; }
  .col { fill: #59636e; font-size: 12px; font-weight: 600; letter-spacing: 2px; }
  .node { fill: #1f2328; font-size: 14px; font-weight: 500; }
  .med { fill: #1f2328; font-size: 17px; font-weight: 600; }
  .cap { fill: #59636e; font-size: 12px; }
  .lake { fill: #1f2328; font-size: 13px; font-weight: 600; }
  .lake2 { fill: #59636e; font-size: 12px; }
  .flow { fill: none; stroke: #8c959f; stroke-width: 1.8; stroke-dasharray: 5 7;
           animation: flow 1.6s linear infinite; }
  .hot { stroke: #e8472b; stroke-width: 2.2; }
  @keyframes flow { to { stroke-dashoffset: -24; } }
  .bob { animation: bob 4.5s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .glow { animation: glow 2.8s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { stroke-opacity: 0.35; } 50% { stroke-opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .flow, .bob, .glow { animation: none; } }
</style>
<rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="20" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="30" y="54" class="h1">From source systems to AI-ready data products</text>
<text x="31" y="82" class="sub">The kind of platform I design, build and run: governed, incremental, recoverable.</text>
